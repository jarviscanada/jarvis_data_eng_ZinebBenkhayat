summary: Je suis récemment diplômée de l'École de technologie supérieure avec un baccalauréat en génie logiciel, et je suis enthousiaste à l'idée de mettre mes connaissances et mes compétences en pratique dans un environnement professionnel. Au cours de mes stages, j'ai été exposée à plusieurs facettes du développement logiciel. J'ai débuté comme analyste QA, où j'ai renforcé mes compétences en tests et collaboré étroitement avec les développeurs. J'ai ensuite occupé le rôle de gestionnaire de serveur GitLab, ce qui m'a permis d'apprendre les pipelines CI/CD et l'automatisation. Mes deux derniers stages étaient davantage axés sur le développement, m'offrant une expérience pratique autant en frontend qu'en backend, tout en travaillant dans des environnements Agile tels que Scrum et Kanban. J'ai un fort intérêt pour le développement web ainsi qu'une véritable passion pour la cybersécurité. Durant mes études, j'ai suivi plusieurs cours qui m'ont permis d'explorer les tests d'intrusion, le langage d'assemblage et les notions fondamentales de sécurité. Ce qui m'enthousiasme le plus dans l'industrie du logiciel, c'est son évolution constante, la possibilité de résoudre des problèmes concrets et la chance d'apprendre chaque jour.

