# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: J'ai développé un système de surveillance d'un cluster Linux en utilisant Bash, PostgreSQL, Docker et cron afin de collecter les informations matérielles ainsi que l'utilisation en temps réel du CPU et de la mémoire de chaque noeud. J'ai mis en place des scripts agents automatisés pour stocker ces données et permettre la génération de rapports basés sur SQL pour la planification des ressources. J'ai géré le code source avec Git/GitHub et conteneurisé la base de données PostgreSQL afin de simplifier le déploiement et les tests.


# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
    #project name
  - name: "Plateforme évolutive pour l'analyse de données cliniques et de laboratoire multimodales"
    #URL is optional
    git_url:
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: J'ai développé une plateforme flexible permettant aux chercheurs et aux cliniciens d'explorer les résultats de modèles d'apprentissage automatique issus de données multimodales, incluant la vidéo, la parole, le texte et le suivi oculaire, pour des patients atteints de troubles cognitifs comme l'Alzheimer. La plateforme normalise des sources de données variées, intègre des pipelines de traitement et offre des visualisations configurables adaptées aux différents types de données. L'implémentation met l'accent sur la flexibilité, la sécurité et la convivialité, tout en assurant la maintenabilité, l'interopérabilité et l'évolutivité. Ce projet a impliqué la conception d'interface utilisateur, la gestion de base de données, la programmation en Python et l'apprentissage automatique.

  - name: "Projet d'architecture microservices"
    #URL is optional
    git_url:
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: J'ai développé et amélioré un système de microservices en C# qui compare les temps de déplacement des autobus de la STM avec les données automobiles de TomTom. J'ai intégré l'API de la STM, mis en oeuvre des tactiques architecturales clés (télémétrie, disponibilité, performance, modifiabilité) et déployé l'ensemble des services avec Docker. J'ai renforcé la résilience du système en utilisant ChaosMonkey pour simuler des pannes de conteneurs, des limites de ressources et des interruptions de connecteurs ou de bases de données, et j'ai livré une documentation architecturale claire appuyée par des diagrammes de séquence et des spécifications d'interface.


