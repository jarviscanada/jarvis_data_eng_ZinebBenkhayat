  - title: "Stagiaire développeuse web"
    company: "RVE: Solutions de recharge pour véhicules électriques"
    duration: "01/2025-08/2025"
    description: "J'ai contribué à la prise de décision concernant les fonctionnalités d'une toute nouvelle application et j'ai planifié, créé et géré des tickets Jira selon les exigences des clients. J'ai pris en charge les tickets qui m'étaient assignés et développé des fonctionnalités en Vue.js et TypeScript, tout en automatisant certaines tâches avec Python. J'ai rédigé et exécuté des tests pour assurer la fiabilité des fonctionnalités, documenté l'ensemble des développements réalisés, créé des pull requests sur Bitbucket et validé les fonctionnalités à travers le processus de revue par les pairs."
