    duration: "05/2024-08/2024"
    description: "J'ai analysé les besoins des clients pour un site web de services juridiques afin de définir des spécifications claires des fonctionnalités, puis j'ai développé des fonctionnalités full-stack en utilisant Java Spring Boot pour le backend et Angular pour le frontend. J'ai suivi l'avancement des tâches dans un workflow Kanban et documenté l'ensemble des fonctionnalités développées."
  - title: "Stagiaire gestionnaire de projet pour un serveur GitLab"
    company: "Neptronic"
    duration: "05/2023-08/2023"
    description: "J'ai mis en place une instance de serveur GitLab et configuré des pipelines d'intégration et de déploiement continus (CI/CD) à l'aide de GitLab Runner, automatisant les étapes de build et de déploiement grâce à des scripts Python personnalisés afin d'assurer des flux de développement fiables et automatisés. J'ai planifié, installé et documenté la plateforme tout en formant les utilisateurs à son fonctionnement. J'ai constamment réévalué les besoins et collaboré avec les équipes internes ainsi qu'avec les clients internes pour affiner les processus et adapter la plateforme aux besoins évolutifs."
  - title: "Stagiaire analyste QA"
    company: "Summit-tech"
    duration: "01/2022-04/2022"
    description: "J'ai conçu et exécuté des scénarios de test complets afin de garantir la qualité et la fiabilité des applications mobiles. J'ai géré les sprints de développement avec Jira en coordonnant les tâches de l'équipe et en suivant l'avancement. J'ai identifié, reproduit et isolé les bugs logiciels, documenté les problèmes de manière détaillée et communiqué les résultats à l'équipe de développement."


