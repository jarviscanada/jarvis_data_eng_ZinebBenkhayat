# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: I developed a Linux cluster monitoring MVP using Bash, PostgreSQL, Docker, and cron to collect hardware information and real-time CPU and memory usage from each node. I implemented automated agent scripts to persist this data and enable SQL-based reporting for resource planning. I managed the source code with Git/GitHub and containerized the PostgreSQL database to simplify deployment and testing.

# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
    #project name
  - name: "Scalable platform for analyzing multimodal clinical and laboratory data"
    #URL is optional
    git_url:
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: I developed a flexible platform that enables researchers and clinicians to explore machine learning results from multimodal data, including video, speech, text, and eye-tracking, for patients with cognitive disorders like Alzheimer. The platform standardizes diverse data sources, integrates data processing pipelines, and provides configurable visualizations tailored to different types of data. The implementation focuses on flexibility, security, and usability, while ensuring maintainability, interoperability, and scalability. This project involved user interface design, database management, Python programming, and machine learning.


